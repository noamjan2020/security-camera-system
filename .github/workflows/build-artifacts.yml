name: Test and build HomeGuard

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Static workspace checks
        run: python scripts/static_checks.py
      - name: Android pure Kotlin security checks
        run: bash scripts/test-android-pure.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows-agent/requirements*.txt
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Test and build Windows agent
        shell: pwsh
        run: .\scripts\build-windows.ps1 -WithOnnx -WithWebRtc
      - uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-Windows
          path: |
            dist/HomeGuardAgent/**
            dist/HomeGuard-Setup.exe
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error

  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/signaling-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  supabase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: deno check backend/supabase/functions/notify-event/index.ts backend/supabase/functions/pair-device/index.ts backend/supabase/functions/create-stream/index.ts

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Restore Firebase configuration
        if: ${{ secrets.HOMEGUARD_GOOGLE_SERVICES_JSON_B64 != '' }}
        run: echo "${{ secrets.HOMEGUARD_GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android-app/app/google-services.json
      - name: Unit tests, lint, and APK
        working-directory: android-app
        env:
          HOMEGUARD_SUPABASE_URL: ${{ secrets.HOMEGUARD_SUPABASE_URL }}
          HOMEGUARD_SUPABASE_ANON_KEY: ${{ secrets.HOMEGUARD_SUPABASE_ANON_KEY }}
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
