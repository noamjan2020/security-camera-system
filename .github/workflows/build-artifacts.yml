name: Test and build HomeGuard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Static workspace checks
        run: python scripts/static_checks.py

      - name: Android pure Kotlin security checks
        run: bash scripts/test-android-pure.sh

  windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows-agent/requirements*.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Test and build Windows agent
        shell: pwsh
        run: .\scripts\build-windows.ps1 -WithOnnx -WithWebRtc

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-Windows
          path: |
            dist/HomeGuardAgent/**
            dist/HomeGuard-Setup.exe
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error

  signaling:
    name: Test signaling server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/signaling-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run signaling tests
        run: npm test

      - name: Build signaling server
        run: npm run build

  supabase-functions:
    name: Check Supabase functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: |
          deno check \
            backend/supabase/functions/notify-event/index.ts \
            backend/supabase/functions/pair-device/index.ts \
            backend/supabase/functions/create-stream/index.ts

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      HOMEGUARD_GOOGLE_SERVICES_JSON_B64: ${{ secrets.HOMEGUARD_GOOGLE_SERVICES_JSON_B64 }}
      HOMEGUARD_SUPABASE_URL: ${{ secrets.HOMEGUARD_SUPABASE_URL }}
      HOMEGUARD_SUPABASE_ANON_KEY: ${{ secrets.HOMEGUARD_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK packages
        shell: bash
        run: |
          # GitHub enables pipefail. `yes` receives SIGPIPE after sdkmanager closes.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Firebase configuration
        if: ${{ env.HOMEGUARD_GOOGLE_SERVICES_JSON_B64 != '' }}
        shell: bash
        run: |
          printf '%s' "$HOMEGUARD_GOOGLE_SERVICES_JSON_B64" \
            | base64 --decode \
            > android-app/app/google-services.json

      - name: Unit tests, lint and APK
        working-directory: android-app
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuard-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

